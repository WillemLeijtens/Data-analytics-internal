services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - STREAMLIT_APP_PASSWORD=${STREAMLIT_APP_PASSWORD}
    volumes:
      - ./data:/app/data
    expose:
      - "8501"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
