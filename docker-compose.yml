services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - STREAMLIT_APP_PASSWORD=${STREAMLIT_APP_PASSWORD}
    volumes:
      - ./data:/app/data
    expose:
      - "8501"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-188.166.88.105}
    ports:
      # Only 443: this droplet's host port 80 is already used by an
      # existing nginx instance for another app — left untouched.
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
