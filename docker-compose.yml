services:
  # Retailer Console: FastAPI + de gebouwde React-SPA in één image. Dit is
  # sinds het verwijderen van de Streamlit-app de enige applicatie hier; de
  # oude app (app/, poller, ./data/analytics.db) is uit de repo gehaald.
  console:
    build:
      context: ./console
    restart: unless-stopped
    environment:
      # EEN schakelaar bepaalt de toegang, zodat instellingen elkaar niet
      # kunnen tegenspreken:
      #   gateway  (standaard) - geen inlog in de app; de forward-auth van
      #                          het portaal is de poortwachter. Een gezette
      #                          CONSOLE_PASSWORD wordt genegeerd (met melding
      #                          in de log), dus nooit een tweede popup.
      #   password             - HTTP basic auth in de app; vereist
      #                          CONSOLE_PASSWORD en een gateway die de
      #                          Authorization-header injecteert.
      # Gateway-modus mag alleen bij een prive binding: de app weigert te
      # starten bij gateway + 0.0.0.0.
      - CONSOLE_AUTH=${CONSOLE_AUTH:-gateway}
      - CONSOLE_BIND=${CONSOLE_BIND:-127.0.0.1}
      - CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-}
      - CONSOLE_USER=${CONSOLE_USER:-console}
      - CONSOLE_MAX_UPLOAD_MB=${CONSOLE_MAX_UPLOAD_MB:-200}
      # Contractanalyse (PDF-upload → looptijd + condities). Zonder sleutel
      # blijft de rest van de app werken; een upload geeft dan een nette 422.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CONSOLE_CONTRACT_MODEL=${CONSOLE_CONTRACT_MODEL:-}
    volumes:
      - ./console/data:/srv/data
    ports:
      # Standaard ALLEEN op loopback: toegang loopt via het portaal
      # (forward-auth op de gateway), niet via het publieke IP. Moet de
      # gateway erbij, zet dan CONSOLE_BIND op het privé-adres van deze
      # droplet — nooit op 0.0.0.0.
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-8010}:8000"
    # Begrenst wat één kwaadaardig/kapot Excel-bestand (bv. een decompressie-
    # bom) maximaal aan hostgeheugen kan opeisen voordat de container zelf
    # herstart in plaats van de hele droplet te laten vastlopen.
    mem_limit: ${CONSOLE_MEM_LIMIT:-1g}

  # Dagelijkse back-up van de console-database naar ./backups, 14 dagen
  # bewaard. Zonder deze service staat de volledige importhistorie op één
  # droplet zonder kopie. Leest de database alleen; draait als eigen
  # container zodat er geen cron op de host nodig is. Herstellen: zie
  # deploy/restore.md.
  backup:
    image: alpine:3
    restart: unless-stopped
    environment:
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      # BEWUST niet :ro. Een SQLite-database in WAL-modus is niet te openen
      # zonder schrijfrechten: de lezer moet de index in het -shm-bestand
      # kunnen aanmaken en bijwerken, ook als hij verder alleen leest. Met
      # `:ro` faalde elke back-up met "unable to open database file" — en
      # omdat dat alleen in de containerlog stond, viel het niet op.
      # De back-up zelf schrijft nog steeds uitsluitend naar /backups.
      - ./console/data:/data/console
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && exec /bin/sh /backup.sh"]
